<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LS Tuner">
<meta name="format-detection" content="telephone=no">
<title>LS Tuner</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0c11;
    --bg-1:#12151d;
    --panel:#161a24;
    --panel-2:#1d222e;
    --line:#262c3a;
    --accent:#2fe88f;
    --accent-dim:#1c7a52;
    --warn:#ffb020;
    --danger:#ff4d5e;
    --text:#f3f5f9;
    --muted:#8891a3;
    --muted-2:#5b6376;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 110%, #13201c 0%, transparent 55%),
      var(--bg-0);
    color:var(--text);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    /* Generous, explicit safe-area padding: standalone/home-screen mode on
       iOS (status-bar-style: black-translucent) draws the page under the
       status bar and home indicator, so this has to clear both — a bare
       max(18px, env(...)) left the header hugging the status bar. */
    padding-top:calc(env(safe-area-inset-top) + 18px);
    padding-left:16px;
    padding-right:16px;
    padding-bottom:calc(env(safe-area-inset-bottom) + 40px);
    overflow-x:hidden;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
    user-select:none;
    touch-action:manipulation;
  }
  button, .icon-btn, .fab, .chip, .seg-item, .string-btn, .toggle{
    touch-action:manipulation;
  }
  @media (max-width:360px){
    .note-name{font-size:52px;}
    .brand-text h1{font-size:14.5px;}
    .card{padding:18px 14px 16px;}
  }
  @media (min-width:480px){
    body{padding-top:36px;}
  }

  /* ---------- Header ---------- */
  .appbar{
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-icon{
    width:40px; height:40px;
    border-radius:12px;
    background:linear-gradient(145deg, #2fe88f, #1b8a5a);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow:0 6px 16px rgba(47,232,143,.25), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand-text h1{
    font-size:16px;
    font-weight:800;
    margin:0;
    letter-spacing:.2px;
  }
  .brand-text p{
    font-size:11px;
    color:var(--muted);
    margin:1px 0 0;
    font-weight:500;
  }
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s, transform .15s;
  }
  .icon-btn:active{transform:scale(0.92); background:var(--panel-2);}

  /* ---------- Segmented tabs ---------- */
  .segmented{
    position:relative;
    width:100%;
    max-width:430px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:4px;
    margin-bottom:12px;
  }
  .seg-highlight{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width:calc(25% - 4px);
    background:linear-gradient(145deg, #2fe88f, #20a26a);
    border-radius:12px;
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:0 4px 14px rgba(47,232,143,.3);
    z-index:0;
  }
  .seg-item{
    position:relative;
    z-index:1;
    text-align:center;
    padding:10px 2px;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    border-radius:12px;
    transition:color .2s;
    white-space:nowrap;
  }
  .seg-item.active{color:#06291c;}

  /* ---------- tuning chip row ---------- */
  .chip-row{
    width:100%;
    max-width:430px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:12px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip-row.hidden{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--line);
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
  }
  .chip.active{
    background:rgba(47,232,143,.12);
    border-color:var(--accent);
    color:var(--accent);
  }

  /* ---------- Main card ---------- */
  .card{
    width:100%;
    max-width:430px;
    background:linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 100%);
    border:1px solid var(--line);
    border-radius:28px;
    padding:18px 20px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    position:relative;
    overflow:hidden;
  }
  .error-box{
    background:rgba(255,77,94,.12);
    border:1px solid rgba(255,77,94,.3);
    color:#ff9aa4;
    border-radius:12px;
    padding:10px 14px;
    font-size:12.5px;
    text-align:center;
    margin-bottom:14px;
    display:none;
    font-weight:600;
  }

  /* status row */
  .status-row{
    display:flex;
    justify-content:center;
    margin-bottom:6px;
  }
  .status-pill{
    font-size:11.5px;
    font-weight:700;
    padding:5px 14px;
    border-radius:999px;
    background:var(--panel-2);
    color:var(--muted);
    letter-spacing:.2px;
    transition:background .2s, color .2s;
  }
  .status-pill.good{background:rgba(47,232,143,.15); color:var(--accent);}
  .status-pill.low, .status-pill.high{background:rgba(255,176,32,.14); color:var(--warn);}

  /* input level meter — lets you SEE the mic is picking up sound even
     before a clean pitch locks in, so it's obvious the mic is working */
  .level-row{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:220px;
    margin:0 auto 10px;
  }
  .level-track{
    flex:1;
    height:5px;
    border-radius:999px;
    background:var(--panel-2);
    overflow:hidden;
  }
  .level-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #4a5568, var(--accent));
    transition:width .08s linear;
  }
  .level-icon{
    font-size:11px;
    opacity:.5;
  }

  /* ---------- Dial ---------- */
  .dial-wrap{
    position:relative;
    margin:6px auto 2px;
    width:100%;
    max-width:320px;
  }
  .dial-wrap svg{overflow:visible; display:block; width:100%; height:auto;}
  .needle-grp{
    transform-origin:160px 168px;
    transition:transform .12s cubic-bezier(.3,.6,.3,1);
  }
  .tick-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    fill:var(--muted-2);
    font-weight:500;
  }
  .center-readout{
    position:absolute;
    left:0; right:0;
    top:52%;
    text-align:center;
    pointer-events:none;
  }
  .note-name{
    font-family:'Manrope', sans-serif;
    font-size:64px;
    font-weight:800;
    line-height:1;
    color:var(--text);
    transition:color .15s, transform .15s;
    letter-spacing:-1px;
  }
  .note-name.good{color:var(--accent); transform:scale(1.04);}
  .note-name.off{color:var(--text);}
  .octave-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    vertical-align:top;
    font-weight:700;
    margin-left:2px;
  }
  .freq{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
    letter-spacing:.3px;
  }
  .cents-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:2px;
  }
  .cents-arrow{
    font-size:14px;
    opacity:.35;
    transition:opacity .15s, color .15s;
    font-weight:800;
  }
  .cents-arrow.flat{color:var(--danger);}
  .cents-arrow.sharp{color:var(--danger);}
  .cents-arrow.lit{opacity:1;}
  .cents-num{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
    min-width:54px;
    text-align:center;
    font-weight:600;
  }

  .in-tune-ring{
    position:absolute;
    inset:-3px;
    border-radius:28px;
    pointer-events:none;
    opacity:0;
    box-shadow:0 0 0 2px var(--accent), 0 0 30px 4px rgba(47,232,143,.35);
    transition:opacity .25s;
  }
  .in-tune-ring.show{opacity:1;}

  /* ---------- Strings ---------- */
  .strings{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin:14px 0 16px;
  }
  .strings.bass{grid-template-columns:repeat(4,1fr);}
  .string-btn{
    position:relative;
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:11px 0 9px;
    text-align:center;
    color:var(--text);
    font-weight:800;
    font-size:15px;
    font-family:'JetBrains Mono', monospace;
    transition:all .18s;
  }
  .string-btn .octave{
    display:block;
    font-size:9px;
    color:var(--muted);
    font-weight:600;
    margin-top:2px;
    letter-spacing:.3px;
  }
  .string-btn{cursor:pointer;}
  .string-btn.target{
    border-color:var(--accent);
    background:rgba(47,232,143,.08);
    box-shadow:0 0 0 1px rgba(47,232,143,.25);
  }
  /* manually pinned string: stays marked even in silence, and overrides
     auto nearest-string matching so only this string is listened for */
  .string-btn.pinned{
    border-color:#5b9dff;
    box-shadow:0 0 0 1px rgba(91,157,255,.35);
  }
  .string-btn.pinned::before{
    content:"📌";
    position:absolute;
    top:-7px; left:-7px;
    font-size:11px;
    line-height:1;
  }
  .string-btn.pinned.in-tune{
    background:linear-gradient(160deg, var(--accent), var(--accent-dim));
    border-color:transparent;
  }
  .string-btn.in-tune{
    background:linear-gradient(160deg, var(--accent), var(--accent-dim));
    color:#06291c;
    border-color:transparent;
  }
  .string-btn.in-tune .octave{color:#07331f;}
  .string-btn.in-tune::after{
    content:"✓";
    position:absolute;
    top:-6px; right:-6px;
    width:18px; height:18px;
    background:var(--accent);
    color:#06291c;
    border-radius:50%;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
    font-weight:900;
  }

  /* ---------- Mic FAB ---------- */
  .fab-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:4px;
  }
  .fab{
    width:76px; height:76px;
    border-radius:50%;
    border:none;
    background:linear-gradient(150deg, #2fe88f, #1b8a5a);
    color:#06291c;
    font-size:28px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(47,232,143,.3), inset 0 1px 0 rgba(255,255,255,.3);
    position:relative;
    transition:transform .12s;
  }
  .fab:active{transform:scale(0.94);}
  .fab.listening{
    background:linear-gradient(150deg, #ff5c6a, #b9273a);
    box-shadow:0 10px 26px rgba(255,92,106,.3), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .fab-pulse{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
  }
  .fab.listening .fab-pulse{
    animation:pulseRing 1.6s ease-out infinite;
    border-color:#ff5c6a;
  }
  @keyframes pulseRing{
    0%{transform:scale(0.9); opacity:.55;}
    100%{transform:scale(1.5); opacity:0;}
  }
  .fab-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.3px;
  }

  /* ---------- Settings sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .2s;
    z-index:20;
  }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:24px 24px 0 0;
    padding:20px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.3,.8,.4,1);
    z-index:21;
    max-width:430px;
    margin:0 auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet h3{
    margin:0 0 16px;
    font-size:15px;
    font-weight:800;
  }
  .sheet-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .sheet-row:last-of-type{border-bottom:none;}
  .sheet-row label{
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
  }
  .sheet-row .hint-text{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    font-weight:500;
  }
  .ref-input-group{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 10px;
  }
  .ref-input-group input{
    width:54px;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    text-align:center;
  }
  .ref-input-group input:focus{outline:none;}
  .ref-input-group span{font-size:11px; color:var(--muted); font-weight:600;}
  .toggle{
    width:44px; height:26px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    transition:background .2s;
  }
  .toggle.on{background:var(--accent-dim); border-color:var(--accent);}
  .toggle .knob{
    position:absolute;
    top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:#fff;
    transition:transform .2s;
  }
  .toggle.on .knob{transform:translateX(18px); background:#eafff4;}
  .sheet-close{
    width:100%;
    margin-top:16px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:var(--panel-2);
    color:var(--text);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--muted-2);
    margin-top:16px;
    line-height:1.6;
    max-width:430px;
    font-weight:500;
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <div class="brand-icon">🎸</div>
    <div class="brand-text">
      <h1>LS Tuner</h1>
      <p>기타 · 베이스 · 일렉기타</p>
    </div>
  </div>
  <div class="icon-btn" id="settingsBtn">⚙️</div>
</div>

<div class="segmented" id="segmented">
  <div class="seg-highlight" id="segHighlight"></div>
  <div class="seg-item active" data-mode="guitar">기타</div>
  <div class="seg-item" data-mode="electric">일렉기타</div>
  <div class="seg-item" data-mode="bass">베이스</div>
  <div class="seg-item" data-mode="chromatic">크로매틱</div>
</div>

<div class="chip-row" id="tuningChipRow">
  <div class="chip active" data-tuning="standard">스탠다드</div>
  <div class="chip" data-tuning="dropD">드롭 D</div>
  <div class="chip" data-tuning="halfStepDown">하프스텝 다운</div>
  <div class="chip" data-tuning="fullStepDown">풀스텝 다운</div>
</div>

<div class="card">
  <div class="in-tune-ring" id="inTuneRing"></div>

  <div class="error-box" id="errorBox"></div>

  <div class="status-row">
    <div class="status-pill" id="statusPill">대기 중</div>
  </div>

  <div class="level-row" id="levelRow" style="visibility:hidden;">
    <span class="level-icon">🎤</span>
    <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
  </div>

  <div class="dial-wrap">
    <svg viewBox="0 0 320 185" width="100%" height="100%">
      <defs>
        <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff4d5e"/>
          <stop offset="20%" stop-color="#ffb020"/>
          <stop offset="42%" stop-color="#2fe88f"/>
          <stop offset="58%" stop-color="#2fe88f"/>
          <stop offset="80%" stop-color="#ffb020"/>
          <stop offset="100%" stop-color="#ff4d5e"/>
        </linearGradient>
      </defs>
      <!-- background track -->
      <path d="M 28 168 A 132 132 0 0 1 292 168" fill="none" stroke="#20242e" stroke-width="14" stroke-linecap="round"/>
      <!-- colored arc -->
      <path d="M 28 168 A 132 132 0 0 1 292 168" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
      <!-- tick marks -->
      <g id="ticks"></g>
      <text x="28" y="183" class="tick-label" text-anchor="middle">-50</text>
      <text x="160" y="22" class="tick-label" text-anchor="middle">0</text>
      <text x="292" y="183" class="tick-label" text-anchor="middle">+50</text>
      <!-- needle -->
      <g class="needle-grp" id="needle">
        <line x1="160" y1="168" x2="160" y2="48" stroke="#f3f5f9" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="160" cy="168" r="8" fill="#f3f5f9"/>
        <circle cx="160" cy="168" r="3.5" fill="#0a0c11"/>
      </g>
    </svg>

    <div class="center-readout">
      <div>
        <span class="note-name" id="noteName">—</span><span class="octave-tag" id="octaveTag"></span>
      </div>
      <div class="freq" id="freqText">0.0 Hz</div>
      <div class="cents-row">
        <span class="cents-arrow flat" id="flatArrow">♭</span>
        <span class="cents-num" id="centsLabel">0 cents</span>
        <span class="cents-arrow sharp" id="sharpArrow">♯</span>
      </div>
    </div>
  </div>

  <div class="strings" id="stringsRow"></div>

  <div class="fab-wrap">
    <button class="fab" id="startBtn">
      <div class="fab-pulse"></div>
      <span id="fabIcon">🎙️</span>
    </button>
    <div class="fab-label" id="fabLabel">탭해서 시작</div>
  </div>
</div>

<div class="hint">
  악기를 마이크 가까이에 대고 한 줄씩 튕겨주세요.<br>
  바늘이 가운데서 초록색으로 멈추면 튜닝 완료예요.<br>
  줄을 탭하면 📌 그 줄만 고정해서 측정해요 — 다시 탭하면 자동 인식으로 돌아가요.
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <h3>설정</h3>
  <div class="sheet-row">
    <div>
      <label>기준 피치 (A4)</label>
      <span class="hint-text">보통 440Hz를 사용해요</span>
    </div>
    <div class="ref-input-group">
      <input type="number" id="refFreq" value="440" min="400" max="480" step="1">
      <span>Hz</span>
    </div>
  </div>
  <div class="sheet-row">
    <div>
      <label>진동 피드백</label>
      <span class="hint-text">튜닝 완료 시 짧게 진동 (지원 기기만)</span>
    </div>
    <div class="toggle on" id="vibrateToggle"><div class="knob"></div></div>
  </div>
  <div class="sheet-row">
    <div>
      <label>화면 꺼짐 방지</label>
      <span class="hint-text">튜닝 중 화면이 자동으로 꺼지지 않게 함 (지원 기기만)</span>
    </div>
    <div class="toggle" id="wakeLockToggle"><div class="knob"></div></div>
  </div>
  <button class="sheet-close" id="sheetClose">닫기</button>
</div>

<script>
(function(){
  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  const SIX_STRING_TUNINGS = {
    standard: [
      {name:"E2", freq:82.41}, {name:"A2", freq:110.00}, {name:"D3", freq:146.83},
      {name:"G3", freq:196.00}, {name:"B3", freq:246.94}, {name:"E4", freq:329.63}
    ],
    dropD: [
      {name:"D2", freq:73.42}, {name:"A2", freq:110.00}, {name:"D3", freq:146.83},
      {name:"G3", freq:196.00}, {name:"B3", freq:246.94}, {name:"E4", freq:329.63}
    ],
    halfStepDown: [
      {name:"D#2", freq:77.78}, {name:"G#2", freq:103.83}, {name:"C#3", freq:138.59},
      {name:"F#3", freq:185.00}, {name:"A#3", freq:233.08}, {name:"D#4", freq:311.13}
    ],
    fullStepDown: [
      {name:"D2", freq:73.42}, {name:"G2", freq:98.00}, {name:"C3", freq:130.81},
      {name:"F3", freq:174.61}, {name:"A3", freq:220.00}, {name:"D4", freq:293.66}
    ]
  };

  const TUNINGS = {
    bass: [
      {name:"E1", freq:41.20}, {name:"A1", freq:55.00}, {name:"D2", freq:73.42}, {name:"G2", freq:98.00}
    ]
  };

  const SIX_STRING_MODES = ["guitar", "electric"];
  const MODE_ORDER = ["guitar", "electric", "bass", "chromatic"];

  let mode = "guitar";
  let tuningVariant = "standard";
  let refA4 = 440;
  let vibrateOn = true;
  let wasInTune = false;
  let audioCtx, analyser, mediaStream, rafId;
  let listening = false;
  // When set, only this one string is matched against (tap a string to pin
  // it, tap again to go back to auto nearest-string detection).
  let manualTarget = null;

  // ---- DOM ----
  const noteNameEl = document.getElementById("noteName");
  const octaveTagEl = document.getElementById("octaveTag");
  const freqTextEl = document.getElementById("freqText");
  const needleEl = document.getElementById("needle");
  const centsLabelEl = document.getElementById("centsLabel");
  const flatArrowEl = document.getElementById("flatArrow");
  const sharpArrowEl = document.getElementById("sharpArrow");
  const statusPillEl = document.getElementById("statusPill");
  const stringsRowEl = document.getElementById("stringsRow");
  const startBtn = document.getElementById("startBtn");
  const fabIcon = document.getElementById("fabIcon");
  const fabLabel = document.getElementById("fabLabel");
  const refFreqInput = document.getElementById("refFreq");
  const errorBox = document.getElementById("errorBox");
  const tuningChipRow = document.getElementById("tuningChipRow");
  const inTuneRing = document.getElementById("inTuneRing");
  const segmented = document.getElementById("segmented");
  const segHighlight = document.getElementById("segHighlight");
  const settingsBtn = document.getElementById("settingsBtn");
  const sheet = document.getElementById("sheet");
  const sheetBackdrop = document.getElementById("sheetBackdrop");
  const sheetClose = document.getElementById("sheetClose");
  const vibrateToggle = document.getElementById("vibrateToggle");
  const wakeLockToggle = document.getElementById("wakeLockToggle");
  const ticksG = document.getElementById("ticks");
  const levelRow = document.getElementById("levelRow");
  const levelFill = document.getElementById("levelFill");

  // Visual input-level meter so it's obvious the mic is actually picking up
  // sound, independent of whether a clean pitch has locked in yet.
  const LEVEL_METER_MAX_RMS = 0.05; // rms that fills the bar to 100% (lower = more sensitive-looking)
  function updateLevelMeter(rms){
    const pct = Math.max(0, Math.min(100, (rms / LEVEL_METER_MAX_RMS) * 100));
    levelFill.style.width = pct + "%";
  }

  // ---- device-adaptive performance ----
  // Low-core-count / unknown devices get a smaller analysis window and a
  // slightly slower update rate so the pitch loop doesn't compete with the
  // UI thread on older phones; capable devices get the sharper settings.
  const LOW_POWER = (navigator.hardwareConcurrency || 4) <= 2;
  const FFT_SIZE = LOW_POWER ? 2048 : 4096;
  const ANALYSIS_INTERVAL_MS = LOW_POWER ? 90 : 60;

  // ---- draw tick marks on the arc ----
  (function drawTicks(){
    const cx = 160, cy = 168, r = 132;
    [-50,-37.5,-25,-12.5,0,12.5,25,37.5,50].forEach(v => {
      const angleDeg = 270 + (v/50)*90; // -50 -> 180deg(left), 0 -> 270deg(top), +50 -> 360deg(right)
      const rad = (angleDeg * Math.PI) / 180;
      const major = (v === 0 || v === -50 || v === 50);
      const r1 = r - (major ? 16 : 10);
      const r2 = r - 2;
      const x1 = cx + r1*Math.cos(rad), y1 = cy + r1*Math.sin(rad);
      const x2 = cx + r2*Math.cos(rad), y2 = cy + r2*Math.sin(rad);
      const line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke", major ? "#8891a3" : "#3a4152");
      line.setAttribute("stroke-width", major ? 2 : 1.2);
      ticksG.appendChild(line);
    });
  })();

  // ---- settings sheet ----
  function openSheet(){ sheetBackdrop.classList.add("show"); sheet.classList.add("show"); }
  function closeSheet(){ sheetBackdrop.classList.remove("show"); sheet.classList.remove("show"); }
  settingsBtn.addEventListener("click", openSheet);
  sheetClose.addEventListener("click", closeSheet);
  sheetBackdrop.addEventListener("click", closeSheet);
  vibrateToggle.addEventListener("click", () => {
    vibrateOn = !vibrateOn;
    vibrateToggle.classList.toggle("on", vibrateOn);
  });
  refFreqInput.addEventListener("input", () => {
    const v = parseFloat(refFreqInput.value);
    if (!isNaN(v) && v > 300 && v < 500) refA4 = v;
  });

  // ---- segmented tab control ----
  function setHighlight(index){
    segHighlight.style.transform = "translateX(" + (index * 100) + "%)";
  }
  document.querySelectorAll(".seg-item").forEach((tab, idx) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".seg-item").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      setHighlight(idx);
      mode = tab.dataset.mode;
      tuningChipRow.classList.toggle("hidden", !SIX_STRING_MODES.includes(mode));
      manualTarget = null; // string set changed, drop any pin
      renderStrings();
    });
  });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      tuningVariant = chip.dataset.tuning;
      manualTarget = null; // tuning changed, drop any pin
      renderStrings();
    });
  });

  function currentStrings(){
    if (mode === "bass") return TUNINGS.bass;
    if (SIX_STRING_MODES.includes(mode)) return SIX_STRING_TUNINGS[tuningVariant];
    return null;
  }

  function renderStrings(){
    if (mode === "chromatic"){
      stringsRowEl.style.display = "none";
      return;
    }
    stringsRowEl.style.display = "grid";
    stringsRowEl.className = "strings" + (mode === "bass" ? " bass" : "");
    const strings = currentStrings();
    stringsRowEl.innerHTML = "";
    strings.forEach(s => {
      const div = document.createElement("div");
      div.className = "string-btn" + (manualTarget && manualTarget.name === s.name ? " pinned" : "");
      div.dataset.name = s.name;
      const letter = s.name.slice(0, -1);
      div.innerHTML = letter + '<span class="octave">' + s.name + '</span>';
      div.addEventListener("click", () => {
        if (manualTarget && manualTarget.name === s.name){
          manualTarget = null; // tap the pinned string again: back to auto
        } else {
          manualTarget = s;
        }
        renderStrings();
      });
      stringsRowEl.appendChild(div);
    });
  }
  renderStrings();

  function freqToNote(freq){
    const A4 = refA4;
    const noteNum = 12 * (Math.log(freq / A4) / Math.log(2)) + 69;
    const rounded = Math.round(noteNum);
    const cents = Math.round((noteNum - rounded) * 100);
    const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
    const octave = Math.floor(rounded / 12) - 1;
    return {name, octave, cents, midi: rounded};
  }

  // ---- Pitch detection ----
  const MIN_DETECT_FREQ = 25;
  const MAX_DETECT_FREQ = 500;
  // Tuned to match how sensitive dedicated tuner apps (GuitarTuna, Fender
  // Tune, etc.) feel: they pick up a quiet pluck from a phone mic held a
  // little away from the instrument almost instantly. The outlier rejection
  // and needle easing below are what keep this from being jittery at this
  // sensitivity — without them, this level would make the needle flail.
  const SILENCE_RMS = 0.0006;
  const CLARITY_THRESHOLD = 0.28;

  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < SILENCE_RMS) return {freq: -1, clarity: 0, rms};

    const windowed = new Float32Array(SIZE);
    for (let i = 0; i < SIZE; i++){
      const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (SIZE - 1));
      windowed[i] = buf[i] * w;
    }

    const maxLag = Math.min(SIZE - 2, Math.floor(sampleRate / MIN_DETECT_FREQ));
    const minLag = Math.max(2, Math.floor(sampleRate / MAX_DETECT_FREQ));
    if (maxLag <= minLag + 2) return {freq: -1, clarity: 0, rms};

    let c0 = 0;
    for (let i = 0; i < SIZE; i++) c0 += windowed[i] * windowed[i];
    if (c0 <= 0) return {freq: -1, clarity: 0, rms};

    const c = new Float32Array(maxLag + 1);
    for (let lag = minLag; lag <= maxLag; lag++){
      let sum = 0;
      const n = SIZE - lag;
      for (let i = 0; i < n; i++) sum += windowed[i] * windowed[i + lag];
      c[lag] = sum;
    }

    let bestLag = -1, bestVal = -Infinity;
    for (let lag = minLag + 1; lag < maxLag; lag++){
      if (c[lag] > c[lag - 1] && c[lag] >= c[lag + 1] && c[lag] > bestVal){
        bestVal = c[lag];
        bestLag = lag;
      }
    }
    if (bestLag === -1){
      for (let lag = minLag; lag <= maxLag; lag++){
        if (c[lag] > bestVal){ bestVal = c[lag]; bestLag = lag; }
      }
    }
    if (bestLag <= minLag) return {freq: -1, clarity: 0, rms};

    const x1 = c[bestLag - 1] || 0, x2 = c[bestLag], x3 = c[bestLag + 1] || 0;
    const denom = (x1 - 2 * x2 + x3);
    let shift = 0;
    if (denom !== 0) shift = 0.5 * (x1 - x3) / denom;
    const refinedLag = bestLag + Math.max(-0.5, Math.min(0.5, shift));

    const meanLagEnergy = bestVal / (SIZE - bestLag);
    const meanZeroEnergy = c0 / SIZE;
    const clarity = meanZeroEnergy > 0 ? meanLagEnergy / meanZeroEnergy : 0;

    return {freq: sampleRate / refinedLag, clarity, rms};
  }

  function nearestStringTarget(freq){
    if (mode === "chromatic" || !freq) return null;
    const strings = manualTarget ? [manualTarget] : currentStrings();
    const candidates = [freq, freq * 2, freq / 2, freq * 3, freq / 3, freq * 4, freq / 4];
    let best = null, bestFreq = freq, bestCents = Infinity;
    strings.forEach(s => {
      candidates.forEach(f => {
        if (f <= 0) return;
        const cents = Math.abs(1200 * Math.log2(f / s.freq));
        if (cents < bestCents){
          bestCents = cents;
          best = s;
          bestFreq = f;
        }
      });
    });
    // A manually pinned string is trusted over a wider range (up to a full
    // octave) since the user explicitly chose it; auto-matching stays
    // tighter so it doesn't latch onto the wrong neighboring string.
    const tolerance = manualTarget ? 1200 : 600;
    if (!best || bestCents > tolerance) return null;
    return {target: best, correctedFreq: bestFreq};
  }

  const HISTORY_SIZE = 8;
  let freqHistory = [];
  let silenceCount = 0;

  // Needle smoothing: an eased value that chases the raw cents reading
  // instead of jumping straight to it every ~60ms frame. Snaps instantly
  // when the matched note/string changes so switching strings still feels
  // immediate — only steady-state jitter gets smoothed out.
  const CENTS_SMOOTHING = 0.22;
  let displayCents = 0;
  let lastTargetKey = null;

  function medianOf(arr){
    const sorted = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }

  function setInTuneVisual(on){
    inTuneRing.classList.toggle("show", on);
    if (on && !wasInTune && vibrateOn && navigator.vibrate){
      navigator.vibrate(45);
    }
    wasInTune = on;
  }

  function resetDisplay(){
    noteNameEl.textContent = "—";
    noteNameEl.className = "note-name";
    octaveTagEl.textContent = "";
    freqTextEl.textContent = "0.0 Hz";
    centsLabelEl.textContent = "0 cents";
    flatArrowEl.classList.remove("lit");
    sharpArrowEl.classList.remove("lit");
    needleEl.setAttribute("transform", "rotate(0)");
    setInTuneVisual(false);
    document.querySelectorAll(".string-btn").forEach(el => {
      el.classList.remove("target", "in-tune");
    });
  }

  function resetLevelMeter(){
    levelFill.style.width = "0%";
  }

  function updateUI(detected){
    if (detected) updateLevelMeter(detected.rms || 0);

    if (!detected || detected.freq <= 0 || detected.clarity < CLARITY_THRESHOLD ||
        detected.freq < MIN_DETECT_FREQ || detected.freq > MAX_DETECT_FREQ){
      silenceCount++;
      statusPillEl.textContent = (detected && detected.rms > SILENCE_RMS)
        ? "소리는 들리는데 음정이 불확실해요"
        : "소리 감지 중...";
      statusPillEl.className = "status-pill";
      if (silenceCount > 4){
        freqHistory = [];
        lastTargetKey = null;
        displayCents = 0;
        resetDisplay();
      }
      return;
    }
    silenceCount = 0;

    const match = nearestStringTarget(detected.freq);
    const freq = match ? match.correctedFreq : detected.freq;

    // Reject a single wild outlier frame (e.g. a stray octave slip) instead
    // of letting it straight into the averaging window — this is a big part
    // of what made the needle flail around.
    if (freqHistory.length >= 3){
      const runningMedian = medianOf(freqHistory);
      const diffCents = Math.abs(1200 * Math.log2(freq / runningMedian));
      if (diffCents > 120) {
        // ignore this one frame; keep using the existing history
      } else {
        freqHistory.push(freq);
      }
    } else {
      freqHistory.push(freq);
    }
    if (freqHistory.length > HISTORY_SIZE) freqHistory.shift();
    const smoothedFreq = medianOf(freqHistory);

    const info = freqToNote(smoothedFreq);
    noteNameEl.textContent = info.name;
    octaveTagEl.textContent = info.octave;
    freqTextEl.textContent = smoothedFreq.toFixed(1) + " Hz";

    let cents = info.cents;
    if (match){
      const targetMidi = 12 * (Math.log(match.target.freq / refA4) / Math.log(2)) + 69;
      const roundedTargetMidi = Math.round(targetMidi);
      const currentMidi = 12 * (Math.log(smoothedFreq / refA4) / Math.log(2)) + 69;
      cents = Math.round((currentMidi - roundedTargetMidi) * 100);
    }

    cents = Math.max(-50, Math.min(50, cents));

    // Ease the needle toward the new reading rather than snapping to it,
    // unless we just switched to a different note/string (then snap so it
    // still feels responsive when you move to a new string).
    const targetKey = match ? match.target.name : info.name + info.octave;
    if (targetKey !== lastTargetKey){
      displayCents = cents;
      lastTargetKey = targetKey;
    } else {
      displayCents += (cents - displayCents) * CENTS_SMOOTHING;
    }

    centsLabelEl.textContent = (Math.round(displayCents) > 0 ? "+" : "") + Math.round(displayCents) + " cents";

    const angle = (displayCents / 50) * 90; // -90deg..+90deg across the semicircle
    needleEl.setAttribute("transform", "rotate(" + angle + ")");

    const inTune = Math.abs(displayCents) <= 5;
    flatArrowEl.classList.toggle("lit", displayCents < -5);
    sharpArrowEl.classList.toggle("lit", displayCents > 5);

    if (inTune){
      noteNameEl.className = "note-name good";
      statusPillEl.textContent = "✅ 튜닝 완료";
      statusPillEl.className = "status-pill good";
    } else if (displayCents < 0){
      noteNameEl.className = "note-name off";
      statusPillEl.textContent = "조금 더 올려주세요";
      statusPillEl.className = "status-pill low";
    } else {
      noteNameEl.className = "note-name off";
      statusPillEl.textContent = "조금 더 내려주세요";
      statusPillEl.className = "status-pill high";
    }
    setInTuneVisual(inTune);

    document.querySelectorAll(".string-btn").forEach(el => {
      el.classList.remove("target", "in-tune");
      if (match && el.dataset.name === match.target.name){
        el.classList.add("target");
        if (inTune) el.classList.add("in-tune");
      }
    });
  }

  function showError(msg){
    errorBox.style.display = "block";
    errorBox.textContent = msg;
  }
  function clearError(){
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  let analysisBuf = null;
  let pausedForVisibility = false;

  function analysisLoop(ts){
    rafId = requestAnimationFrame(analysisLoop);
    if (ts - lastAnalysisTime < ANALYSIS_INTERVAL_MS) return;
    lastAnalysisTime = ts;
    analyser.getFloatTimeDomainData(analysisBuf);
    const detected = autoCorrelate(analysisBuf, audioCtx.sampleRate);
    updateUI(detected);
  }
  let lastAnalysisTime = 0;

  async function startListening(){
    clearError();
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (err){
      showError("마이크 접근이 거부되었거나 사용할 수 없습니다. 브라우저 권한 설정을 확인해주세요.");
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended"){
      try { await audioCtx.resume(); } catch (e) {}
    }

    const source = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE; // smaller window on low-power devices, see LOW_POWER above
    source.connect(analyser);

    analysisBuf = new Float32Array(analyser.fftSize);
    freqHistory = [];
    silenceCount = 0;
    lastAnalysisTime = 0;

    rafId = requestAnimationFrame(analysisLoop);

    listening = true;
    fabIcon.textContent = "⏹";
    fabLabel.textContent = "탭해서 정지";
    startBtn.classList.add("listening");
    levelRow.style.visibility = "visible";

    requestWakeLock();
  }

  function stopListening(){
    if (rafId) cancelAnimationFrame(rafId);
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    listening = false;
    pausedForVisibility = false;
    fabIcon.textContent = "🎙️";
    fabLabel.textContent = "탭해서 시작";
    startBtn.classList.remove("listening");
    statusPillEl.textContent = "대기 중";
    statusPillEl.className = "status-pill";
    freqHistory = [];
    silenceCount = 0;
    resetDisplay();
    resetLevelMeter();
    levelRow.style.visibility = "hidden";
    releaseWakeLock();
  }

  startBtn.addEventListener("click", () => {
    if (!listening) startListening();
    else stopListening();
  });

  // ---- Wake Lock (keep screen on while tuning) ----
  let wakeLock = null;
  let wakeLockOn = false;

  async function requestWakeLock(){
    if (!wakeLockOn || !listening || !("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e){ /* denied or unsupported — tuner still works, screen may sleep */ }
  }
  function releaseWakeLock(){
    if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  }

  wakeLockToggle.addEventListener("click", () => {
    wakeLockOn = !wakeLockOn;
    wakeLockToggle.classList.toggle("on", wakeLockOn);
    if (wakeLockOn) requestWakeLock();
    else releaseWakeLock();
  });

  // ---- Pause audio processing when the tab/app is backgrounded ----
  // Saves battery/CPU on phones and avoids the mic silently running while
  // the screen is off; resumes automatically when the user comes back,
  // and the wake lock (which the browser drops on hide) is re-acquired too.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      if (listening && audioCtx && audioCtx.state === "running"){
        audioCtx.suspend().catch(()=>{});
        if (rafId) cancelAnimationFrame(rafId);
        pausedForVisibility = true;
      }
    } else {
      if (pausedForVisibility && audioCtx){
        audioCtx.resume().catch(()=>{});
        lastAnalysisTime = 0;
        rafId = requestAnimationFrame(analysisLoop);
        pausedForVisibility = false;
        requestWakeLock();
      }
    }
  });

})();
</script>

</body>
</html>
